<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | SMJV</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1F1006 0%, #2A1608 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .denied-card {
            text-align: center;
            max-width: 500px;
            padding: 48px 32px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.1);
            margin: 24px;
        }
        .lock-icon { font-size: 5rem; margin-bottom: 16px; }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; margin-bottom: 12px; }
        p { opacity: 0.7; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: #E8723A;
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            margin-top: 16px;
        }
        .btn:hover { background: #C8551E; }
    </style>
</head>
<body>
    <div class="denied-card">
        <div class="lock-icon">🔒</div>
        <h1>Access Denied</h1>
        <p>You do not have permission to access this page. This area is restricted to authorized personnel only.</p>
        <a href="index.html" class="btn">← Return to Homepage</a>
        <p style="font-size:0.7rem; margin-top: 24px;">If you believe this is an error, please contact system administrator.</p>
    </div>
</body>
</html>
